<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Winter Strength & Hypertrophy</title>

  <style>
    :root {
      --bg: #fbfbf9;
      --card-bg: #ffffff;
      --card-inner: #f5f4ee;
      --border: #e6e4dc;
      --border-dark: #d5d2c7;
      --text: #1f1f1d;
      --text-muted: #83827d;
      --amber: #e59312;
      --amber-dark: #b86e00;
      --danger: #dc2626;
      --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.45;
      padding-bottom: 70px;
    }

    .app-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    /* Header & Bar */
    header {
      padding: 10px 4px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .app-subtitle {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--amber-dark);
    }

    .actions-row {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn:active {
      background-color: var(--card-inner);
    }
